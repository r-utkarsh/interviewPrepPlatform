# FILE: .mvn/wrapper/maven-wrapper.properties
# WHAT IT DOES: Pins the Apache Maven Wrapper and Maven distribution used by this repository.
# ROLE IN THE PROJECT: Makes backend builds repeatable without a system-wide Maven installation.
# IF YOU REMOVE THIS FILE: The wrapper scripts cannot locate the required Maven distribution.
# DEPENDS ON: Apache Maven Central and the Apache Maven Wrapper scripts.
# USED BY: mvnw and mvnw.cmd.
# KEY FUNCTIONS: distributionUrl selects Maven; distributionSha256Sum verifies its downloaded archive.

wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.12/apache-maven-3.9.12-bin.zip
distributionSha256Sum=305773a68d6ddfd413df58c82b3f8050e89778e777f3a745c8e5b8cbea4018ef
